[package]
name = "content"
description = "Content loading, registry, and expression evaluation for alacod"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy_fixed = { path = "../bevy_fixed" }
sim_core = { path = "../sim_core" }
bevy = { version = "0.19.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
ron = "0.12"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]

[[bin]]
name = "alacod"
path = "src/bin/alacod.rs"
