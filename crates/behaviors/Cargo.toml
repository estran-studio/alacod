[package]
name = "behaviors"
version = "0.1.0"
edition = "2021"
description = "Contrats de behaviors composables (M1, D1), sans systèmes en vague 0"

[dependencies]
bevy = { version = "0.19.1", default-features = false }
sim_core = { path = "../sim_core" }
bevy_fixed = { path = "../bevy_fixed" }
utils = { path = "../utils" }
effects = { path = "../effects" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
ron = "0.12"
