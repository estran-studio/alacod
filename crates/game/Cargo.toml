
[package]
name = "game"
version = "0.2.0"
edition = "2021"

[dependencies]
bevy = "0.19.1"
ggrs = "0.13.0"
bevy_ggrs = "0.22.0"
bevy_kira_audio = { version = "0.26" }
# TODO: revenir sur une release crates.io quand bevy_matchbox supportera bevy 0.19
# (port upstream: https://github.com/johanhelsing/matchbox/pull/557)
bevy_matchbox = { git = "https://github.com/AdamWhitehurst/matchbox", rev = "593f900c4f27e94632a71232389d9e4ffaeb9bdf", features = ["ggrs"] }
bevy_light_2d = { version = "0.10", optional = true }
leafwing-input-manager = "0.21.0"
bevy_common_assets = { version = "0.17", features = ["ron"]}

bevy_fixed = { path = "../bevy_fixed"}
utils = { path = "../utils"}
map = { path = "../map"}
animation ={ path = "../animation"}
telemetry = { path = "../telemetry"}
# TODO: harmonium_bevy est encore sur bevy 0.17, réactiver la feature `harmonium` après son port
harmonium_bevy = { git = "https://github.com/bascanada/harmonium", branch = "main", optional = true }

thiserror = "2.0.12"

serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
serde_json = "1.0"
once_cell = "1.19.0"
pathfinding = "4.9.1"
lazy_static = "1.5.0"

wasm-bindgen = "0.2"

clap = { version = "4.4", features = ["derive"] }

bevy-inspector-egui = { version = "0.37.0", optional = true }
chrono = "0.4.42"


[dependencies.web-sys]
version = "0.3"
# Enable features for the APIs we need
features = [
  'Window',
  'Location',
  'UrlSearchParams', # Provides easy parsing of query strings
]

[features]
# Enable debug UI (Egui / World Inspector) for development builds
debug_ui = ["bevy-inspector-egui"]
# Enable lighting system (disabled by default for wasm to improve performance)
lighting = ["bevy_light_2d"]
# Musique générative (harmonium). Désactivée tant que harmonium_bevy n'est pas porté à bevy 0.19
harmonium = ["dep:harmonium_bevy"]

# Contrôle remote (bevy_remote : JSON-RPC sur HTTP), natif uniquement
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19.1", features = ["bevy_remote"] }
