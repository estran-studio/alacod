[package]
name = "utils"
version = "0.2.0"
edition = "2021"

[dependencies]
# ECS seul : la frontière simulation/présentation (scripts/check-sim-boundary.sh). Le journal
# natif, le plugin web et la caméra de debug ont déménagé dans `game` (présentation).
bevy = { version = "0.19.1", default-features = false }
bevy_ggrs = "0.22.0"

serde = { version = "1.0", features = ["derive"] }

rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
