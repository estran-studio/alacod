
[package]
name = "map"
version = "0.2.0"
edition = "2021"

[dependencies]
bevy = "0.19.1"
bevy_ecs_ldtk = { version = "0.15", default-features = false, features = ["derive", "internal_levels"] }

bevy_fixed = { path = "../bevy_fixed"}
utils = { path = "../utils"}
world = { path = "../world" }

thiserror = "2.0.12"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19.0"
pathfinding = "4.9.1"

bevy-inspector-egui = { version = "0.37.0", optional = true }

[features]
debug_ui = ["bevy-inspector-egui"]
# Rendu des tilemaps LDtk. Sans cette feature, la map existe (entités, colliders) sans être dessinée.
render = ["bevy_ecs_ldtk/render"]