[package]
name = "animation"
version = "0.2.0"
edition = "2021"

# Présentation seule : feuilles de sprites, animation des calques, chargeurs RON. L'état logique
# (`AnimationState`, `FacingDirection`) vit dans `sim_core::animation_state`.
[dependencies]
bevy = "0.19.1"
sim_core = { path = "../sim_core" }

serde = { version = "1.0", features = ["derive"] }

bevy_common_assets = { version = "0.17", features = ["ron"] }

[dev-dependencies]
ron = "0.12"
