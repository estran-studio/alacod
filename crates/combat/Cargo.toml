[package]
name = "combat"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19.1", default-features = false }
bevy_fixed = { path = "../bevy_fixed" }
sim_core = { path = "../sim_core" }
utils = { path = "../utils" }
serde = { version = "1.0", features = ["derive"] }
effects = { path = "../effects" }

animation = { path = "../animation" }
stats = { path = "../stats" }
run = { path = "../run" }
bevy_ggrs = "0.22.0"
ggrs = "0.13.0"
bevy_common_assets = { version = "0.17", features = ["ron"] }
bevy_matchbox = { git = "https://github.com/AdamWhitehurst/matchbox", rev = "593f900c4f27e94632a71232389d9e4ffaeb9bdf", features = ["ggrs"] }

[dev-dependencies]
ron = "0.12"
