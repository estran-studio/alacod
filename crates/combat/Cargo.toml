[package]
name = "combat"
version = "0.1.0"
edition = "2021"

[dependencies]
world = { path = "../world" }
# `serialize` : `Entity` (de)sérialisable (composants portant une `Entity`) ; `bevy_color` : `Color` (teinte du
# joueur), crate de données sans rendu.
bevy = { version = "0.19.1", default-features = false, features = ["serialize", "bevy_color"] }
bevy_fixed = { path = "../bevy_fixed" }
sim_core = { path = "../sim_core" }
utils = { path = "../utils" }
serde = { version = "1.0", features = ["derive"] }
effects = { path = "../effects" }
items = { path = "../items" }

stats = { path = "../stats" }
run = { path = "../run" }
bevy_ggrs = "0.22.0"
ggrs = "0.13.0"
# `PeerId` seul (uuid) : l'adresse GGRS des pairs matchbox, sans socket ni WebRTC.
matchbox_protocol = { git = "https://github.com/AdamWhitehurst/matchbox", rev = "593f900c4f27e94632a71232389d9e4ffaeb9bdf" }

[dev-dependencies]
ron = "0.12"
