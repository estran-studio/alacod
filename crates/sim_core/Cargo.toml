[package]
name = "sim_core"
description = "Contrats partagés par les crates de simulation (combat, stats, effects, behaviors, world, run)"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19.1", default-features = false }
bevy_ggrs = "0.22.0"
bevy_fixed = { path = "../bevy_fixed" }
utils = { path = "../utils" }
serde = { version = "1.0", features = ["derive"] }

schemars = { version = "1", optional = true }

[dev-dependencies]
ron = "0.12"

[features]
schema = ["dep:schemars", "bevy_fixed/schema"]
