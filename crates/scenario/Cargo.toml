[package]
name = "scenario"
version = "0.1.0"
edition = "2021"
description = "Parties scriptées et déterministes : tests de comportement et de régression headless"

[dependencies]
world = { path = "../world" }
items = { path = "../items" }
bevy = "0.19.1"
bevy_ggrs = "0.22.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.12"

bevy_fixed = { path = "../bevy_fixed" }
behaviors = { path = "../behaviors" }
meta = { path = "../meta" }
bots = { path = "../bots" }
combat = { path = "../combat" }
content = { path = "../content" }
game = { path = "../game" }
map = { path = "../map" }
map_ldtk = { path = "../map_ldtk" }
sim_core = { path = "../sim_core" }
stats = { path = "../stats" }
run = { path = "../run" }
utils = { path = "../utils" }
# D49 : `alacod-sim --log` (même version que `utils`, aucune crate nouvelle).
tracing-subscriber = { version = "0.3.18", features = ["fmt", "env-filter"] }

[features]
# Bevy en bibliothèque partagée (voir `game`) : transmis à `game`.
dev-dylib = ["game/dev-dylib"]
# Rendu des tilemaps, requis pour afficher un scénario (play_scenario). Les tests
# headless compilent sans.
render = ["map_ldtk/render"]
