[package]
name = "bevy_fixed"
description = "fixed math and rng library for bevy rollback games"
version = "0.2.0"
edition = "2021"

[dependencies]
# D35 : sans les features par défaut de Bevy (rendu, audio, UI) : `make lint` (`-p content`)
# ne compile plus le rendu. Les crates qui en ont besoin les demandent elles-mêmes.
bevy = { version = "0.19.1", default-features = false }

serde = { version = "1.0", features = ["derive"] }

fixed = { version = "1.29", features = [ "serde-str" ] }
fixed-sqrt = "0.2"
fixed_trigonometry = "0.4.4"