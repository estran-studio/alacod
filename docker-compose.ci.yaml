# Services de la CI. `signaling` = matchbox_server nu : reste la recette p2p du README §4
# (chemin `--matchbox`, les clients se retrouvent par le nom de salle). `allumette` (profil
# optionnel) = le serveur de matchmaking (API HTTP /auth, /lobbies, JWT dans le chemin du
# WebSocket) : le client natif implémente ce flux depuis m0-v9 (`--allumette`), et
# scripts/nightly.sh STEP C passe par ce profil (port hôte 3537).
services:
  signaling:
    build:
      context: .
      dockerfile: ci/matchbox.Dockerfile
    ports:
      - "3536:3536"
  allumette:
    profiles: ["allumette"]
    build:
      # Dépôt frère allumette : `../allumette` dans le meta-repo alacod_root ; depuis un
      # worktree de tâche ou le runner, passer ALLUMETTE_DIR=<chemin absolu>.
      context: ${ALLUMETTE_DIR:-../allumette}
      dockerfile: Dockerfile
    ports:
      - "3537:3536"
    environment:
      RUST_LOG: info
