<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revue des scénarios</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --panel-2: #ecebe7; --text: #1d1d1b; --muted: #6b6a66;
    --border: #d9d7d1; --accent: #b4532a; --accent-soft: #f3e3da; --ok: #2f7d4f;
    --ev-kill: #2f7d4f; --ev-death: #b3261e; --ev-hit: #b86e00; --ev-wave: #2a5db0; --ev-other: #6b6a66;
    --radius: 10px; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --panel: #1d1d1b; --panel-2: #262624; --text: #ecebe6; --muted: #9a988f;
      --border: #34332f; --accent: #e07a4b; --accent-soft: #3a2519; --ok: #6cc18d;
      --ev-kill: #6cc18d; --ev-death: #f07b72; --ev-hit: #f0b35a; --ev-wave: #7ea8f0; --ev-other: #9a988f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --panel: #1d1d1b; --panel-2: #262624; --text: #ecebe6; --muted: #9a988f;
    --border: #34332f; --accent: #e07a4b; --accent-soft: #3a2519; --ok: #6cc18d;
    --ev-kill: #6cc18d; --ev-death: #f07b72; --ev-hit: #f0b35a; --ev-wave: #7ea8f0; --ev-other: #9a988f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--border); padding: 20px 16px; background: var(--panel);
          position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  aside h1 { font-size: 17px; margin: 0 0 2px; }
  aside .branch { color: var(--muted); font: 12px var(--mono); margin-bottom: 16px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
             margin: 18px 0 8px; display: flex; justify-content: space-between; }
  aside select, aside input { width: 100%; font: inherit; font-size: 14px; color: var(--text);
             background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
  aside .commit-sub { font-size: 12px; color: var(--muted); margin: 6px 2px 0; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  .nav-item { display: block; width: 100%; text-align: left; border: 1px solid transparent;
              background: none; color: inherit; font: inherit; padding: 7px 10px; border-radius: 8px;
              cursor: pointer; margin-bottom: 3px; }
  .nav-item:hover { background: var(--panel-2); }
  .nav-item.active { background: var(--accent-soft); border-color: var(--accent); }
  .nav-item .name { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .sub { display: block; font: 12px var(--mono); color: var(--muted); }
  .nav-item .tag { font: 11px var(--mono); color: var(--accent); border: 1px solid var(--accent);
                   border-radius: 4px; padding: 0 4px; margin-left: 6px; }
  .nav-item .sha { font: 12px var(--mono); color: var(--accent); }
  main { padding: 0 28px 48px; min-width: 0; }
  .title { padding: 18px 0 10px; }
  .title h2 { margin: 0 0 2px; font-size: 22px; }
  .title p { margin: 0; color: var(--muted); font-size: 14px; }
  .player { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  video { width: 100%; height: auto; display: block; background: #000; max-height: 72vh; }
  .transport { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px;
               border-top: 1px solid var(--border); }
  .transport button, .transport select, .evnav button { font: inherit; font-size: 14px; color: var(--text);
               background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
               padding: 6px 12px; cursor: pointer; min-height: 36px; }
  .transport button:hover, .evnav button:hover { border-color: var(--accent); }
  .transport .primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 100px; }
  .transport .frame { font: 14px var(--mono); color: var(--muted); min-width: 150px; text-align: right; }
  .timeline { position: relative; flex: 1 1 260px; height: 28px; cursor: pointer; min-width: 180px; }
  .timeline .track { position: absolute; left: 0; right: 0; top: 11px; height: 6px; background: var(--panel-2);
                     border-radius: 3px; border: 1px solid var(--border); }
  .timeline .progress { position: absolute; left: 0; top: 11px; height: 6px; background: var(--accent); border-radius: 3px; width: 0; }
  .timeline .mark { position: absolute; top: 4px; width: 3px; height: 20px; border-radius: 2px; background: var(--ev-other);
                    transform: translateX(-1px); opacity: .9; }
  .timeline .mark.kill { background: var(--ev-kill); } .timeline .mark.death { background: var(--ev-death); }
  .timeline .mark.hit { background: var(--ev-hit); } .timeline .mark.wave { background: var(--ev-wave); }
  .timeline .playhead { position: absolute; top: 1px; width: 2px; height: 26px; background: var(--text); transform: translateX(-1px); }
  .keys { font-size: 12px; color: var(--muted); width: 100%; }
  kbd { font: 11px var(--mono); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; background: var(--panel); }
  .evnav { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); }
  .evnav .current { flex: 1; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .evnav .current .f { font: 12px var(--mono); color: var(--muted); margin-right: 6px; }
  .panels { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px;
           display: flex; flex-direction: column; gap: 10px; }
  .panel h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .desc { margin: 0; color: var(--muted); font-size: 14px; }
  .watch { margin: 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft);
           border-radius: 0 8px 8px 0; font-size: 14px; }
  .watch strong { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 2px; }
  .expect { display: flex; flex-wrap: wrap; gap: 6px; }
  .expect span { font: 12px var(--mono); background: var(--panel-2); border-radius: 6px; padding: 2px 8px; }
  .events { display: flex; flex-direction: column; gap: 4px; max-height: 52vh; overflow-y: auto; position: relative; }
  .ev { font: 13px inherit; font-family: inherit; color: var(--text); background: var(--panel-2);
        border: 1px solid var(--border); border-left: 4px solid var(--ev-other); border-radius: 6px;
        padding: 4px 8px; cursor: pointer; text-align: left; }
  .ev:hover { border-color: var(--accent); }
  .ev .f { font: 12px var(--mono); color: var(--muted); margin-right: 6px; }
  .ev.kill { border-left-color: var(--ev-kill); } .ev.death { border-left-color: var(--ev-death); }
  .ev.hit { border-left-color: var(--ev-hit); } .ev.wave { border-left-color: var(--ev-wave); }
  .ev.past { opacity: .55; }
  .ev.current { outline: 2px solid var(--accent); opacity: 1; }
  textarea { width: 100%; min-height: 90px; resize: vertical; font: 14px inherit; font-family: inherit;
             color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .empty { color: var(--muted); padding: 24px 0; font-size: 14px; }
  .metrics { width: 100%; border-collapse: collapse; font-size: 14px; }
  .metrics th, .metrics td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); }
  .metrics th { background: var(--panel-2); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .metrics td.num { text-align: right; font-family: var(--mono); }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
    main { padding: 0 16px 40px; }
    .panels { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>Revue des scénarios</h1>
    <div class="branch" id="branch"></div>
    <h2>Révision</h2>
    <select id="commit" aria-label="Révision"></select>
    <div class="commit-sub" id="commit-sub"></div>
    <h2>Scénarios <span id="count"></span></h2>
    <input id="filter" placeholder="Filtrer…" aria-label="Filtrer les scénarios">
    <div id="scenarios"></div>
    <h2>Comparaisons</h2>
    <div id="compares"></div>
  </aside>
  <main><div id="view"></div></main>
</div>
<script>
const DATA = /*__DATA__*/null;
const SIM_FPS = 60;             // frames de simulation par seconde de vidéo
const IMAGE_STEP = 2 / SIM_FPS; // une image vidéo = 2 frames (EVERY=2)
const INITIAL_TIME = 1;         // secondes (frame 60) : la caméra a rejoint le joueur

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function store(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key) ?? "";
    localStorage.setItem(key, value);
  } catch { return ""; }
}

// ---- état courant ----------------------------------------------------------------------
let commit = null;      // révision sélectionnée (DATA.commits[i])
let current = null;     // { video: HTMLVideoElement, events: [...] } de la vue affichée
let dragging = false;
let lastHash = "";
function setHash(h) { lastHash = h; if (decodeURIComponent(location.hash.slice(1)) !== h) location.hash = h; }

function commitIndex() { return Math.max(0, DATA.commits.indexOf(commit)); }

// ---- barre latérale --------------------------------------------------------------------
function renderSidebar() {
  $("branch").textContent = DATA.branch ? `branche ${DATA.branch}` : "";
  $("commit").innerHTML = DATA.commits.length
    ? DATA.commits.map((c, i) => `<option value="${i}">${esc(c.id)}${c.date ? ` · ${esc(c.date)}` : ""} · ${c.videos.length} vidéo(s)</option>`).join("")
    : `<option>Aucun rendu</option>`;
  $("commit").value = String(commitIndex());
  $("commit-sub").textContent = commit ? `${commit.subject || ""}${commit.dirty ? " · modifications non commitées" : ""}` : "";
  renderScenarioList();
  $("compares").innerHTML = DATA.compares.length
    ? DATA.compares.map((c, i) => `<button class="nav-item" data-key="compare:${i}" data-compare="${i}">
        <span class="name">${esc(c.scenario)}</span><span class="sub">${esc(c.base)} → ${esc(c.head)}</span></button>`).join("")
    : `<div class="empty">Aucune : <code>make compare_video</code></div>`;
}

function renderScenarioList() {
  const filter = $("filter").value.trim().toLowerCase();
  if (!commit) { $("scenarios").innerHTML = `<div class="empty">Aucun rendu : <code>make videos</code></div>`; return; }
  const items = [];
  if (commit.metrics && Object.keys(commit.metrics).length || (commit.sim && commit.sim.length)) {
    items.push(`<button class="nav-item" data-key="perf" data-perf="1"><span class="name">Performance</span>
      <span class="sub">fps, entités, alacod-sim</span></button>`);
  }
  const videos = commit.videos.filter((v) => !filter || v.name.toLowerCase().includes(filter));
  $("count").textContent = `${videos.length}/${commit.videos.length}`;
  for (const v of videos) {
    const vues = v.name.endsWith(".vues");
    const base = vues ? v.name.slice(0, -5) : v.name;
    items.push(`<button class="nav-item" data-key="video:${esc(v.name)}" data-video="${esc(v.name)}">
      <span class="name">${esc(base)}${vues ? `<span class="tag">vues</span>` : ""}</span>
      <span class="sub">${v.frames ? `${v.frames} frames · ` : ""}${(v.events || []).length} moment(s)</span></button>`);
  }
  if (commit.montage) {
    items.push(`<button class="nav-item" data-key="video:montage" data-video="montage">
      <span class="name">montage</span><span class="sub">grille de tous les scénarios</span></button>`);
  }
  $("scenarios").innerHTML = items.join("") || `<div class="empty">Rien ne correspond au filtre</div>`;
}

function markActive(key) {
  document.querySelectorAll(".nav-item").forEach((b) => b.classList.toggle("active", b.dataset.key === key));
}

// ---- vues ------------------------------------------------------------------------------
function chips(events) {
  return (events || []).map((e, i) => `<button class="ev ${esc(e.kind)}" data-i="${i}" data-frame="${e.frame}"
      title="Aller à la frame ${e.frame}"><span class="f">f${e.frame}</span>${esc(e.label)}</button>`).join("");
}

function playerHtml(src, events) {
  const marks = (events || []).map((e) => `<div class="mark ${esc(e.kind)}" data-frame="${e.frame}" title="f${e.frame} ${esc(e.label)}"></div>`).join("");
  return `<div class="player">
    <video id="video" src="${esc(src)}" preload="auto" muted playsinline></video>
    <div class="transport">
      <button class="primary" id="play">▶ Lecture</button>
      <button id="restart" title="Revenir au début (Début)">⏮</button>
      <button id="back" title="Image précédente (←)">−1 img</button>
      <button id="fwd" title="Image suivante (→)">+1 img</button>
      <select id="speed" title="Vitesse ([ ])">
        <option value="0.25">×0.25</option><option value="0.5">×0.5</option>
        <option value="1" selected>×1</option><option value="2">×2</option><option value="4">×4</option>
      </select>
      <div class="timeline" id="timeline" title="Cliquer ou glisser pour se positionner">
        <div class="track"></div><div class="progress" id="progress"></div>${marks}<div class="playhead" id="playhead"></div>
      </div>
      <span class="frame" id="frame">frame 0</span>
      <div class="keys"><kbd>espace</kbd> lecture · <kbd>←</kbd> <kbd>→</kbd> image par image ·
        <kbd>p</kbd> <kbd>n</kbd> moment clé précédent / suivant · <kbd>[</kbd> <kbd>]</kbd> vitesse · <kbd>Début</kbd> revenir au début</div>
    </div>
    ${(events || []).length ? `<div class="evnav">
      <button id="ev-prev" title="Moment clé précédent (p)">◀ précédent</button>
      <span class="current" id="ev-current">—</span>
      <button id="ev-next" title="Moment clé suivant (n)">suivant ▶</button>
    </div>` : ""}
  </div>`;
}

function infoPanels({ description, watch, expect, events, eventsTitle, noteKey, extraEvents }) {
  const expectHtml = (expect || []).map((e) => `<span>${esc(e)}</span>`).join("");
  return `<div class="panels">
    <div class="panel">
      ${watch ? `<p class="watch"><strong>À regarder</strong>${esc(watch)}</p>` : ""}
      ${description ? `<p class="desc">${esc(description)}</p>` : ""}
      ${expectHtml ? `<h3>Attentes vérifiées par les tests</h3><div class="expect">${expectHtml}</div>` : ""}
      <h3>Notes de revue</h3>
      <textarea placeholder="Gardées dans ce navigateur" data-note="${esc(noteKey)}"></textarea>
    </div>
    <div class="panel">
      <h3>${esc(eventsTitle || "Moments clés")} <span style="font-weight:normal">(clic : aller à la frame)</span></h3>
      ${(events || []).length ? `<div class="events" id="events">${chips(events)}</div>` : `<div class="empty">Aucun moment clé enregistré</div>`}
      ${extraEvents || ""}
    </div>
  </div>`;
}

function selectVideo(name) {
  if (!commit) return;
  const v = name === "montage" ? { name: "montage", events: [] } : commit.videos.find((x) => x.name === name);
  if (!v) return;
  markActive(`video:${name}`);
  const vues = name.endsWith(".vues");
  $("view").innerHTML = `<div class="title"><h2>${esc(vues ? name.slice(0, -5) : name)}${vues ? ` <span class="tag" style="font:12px var(--mono);color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px">vue de chaque joueur</span>` : ""}</h2>
      <p>${esc(commit.id)}${commit.subject ? ` · ${esc(commit.subject)}` : ""}${v.frames ? ` · ${v.frames} frames (${(v.frames / SIM_FPS).toFixed(1)} s)` : ""}</p></div>
    ${playerHtml(`${commit.id}/${name}.mp4`, v.events)}
    ${infoPanels({ description: v.description, watch: v.watch, expect: v.expect, events: v.events, noteKey: `${commit.id}/${name}` })}`;
  setHash(`${commit.id}/${name}`);
  bindPlayer(v.events || [], name);
}

function selectCompare(i) {
  const c = DATA.compares[i];
  if (!c) return;
  markActive(`compare:${i}`);
  const extra = (c.head_events || []).length
    ? `<h3>Moments clés à droite (${esc(c.head)})</h3><div class="events">${chips(c.head_events)}</div>` : "";
  $("view").innerHTML = `<div class="title"><h2>${esc(c.scenario)} : ${esc(c.base)} → ${esc(c.head)}</h2>
      <p>À gauche ${esc(c.base)} (${esc(c.base_subject)}), à droite ${esc(c.head)} (${esc(c.head_subject)})</p></div>
    ${playerHtml(c.file, c.base_events)}
    ${infoPanels({ description: c.description, watch: c.watch, expect: c.expect, events: c.base_events,
      eventsTitle: `Moments clés à gauche (${c.base})`, noteKey: c.file, extraEvents: extra })}`;
  setHash(`compare/${i}`);
  bindPlayer(c.base_events || [], `compare:${i}`);
}

function selectPerf() {
  if (!commit) return;
  markActive("perf");
  current = null;
  const metrics = commit.metrics || {};
  const rows = Object.entries(metrics).sort((a, b) => a[0].localeCompare(b[0])).map(([name, m]) => `
    <tr><td>${esc(name)}</td><td class="num">${Number(m.sim_fps).toFixed(1)}</td><td class="num">${m.frames}</td>
      <td class="num">${m.entities_max}</td><td class="num">${m.bullets_max}</td><td class="num">${m.enemies_max}</td></tr>`).join("");
  const sim = (commit.sim || []).map((r) => `
    <tr><td class="num">${esc(r.seed)}</td><td class="num">${r.wave}</td><td class="num">${r.deaths}</td>
      <td class="num">${r.kills}</td><td class="num">${Number(r.sim_fps).toFixed(1)}</td><td>${r.desync ? "OUI" : ""}</td></tr>`).join("");
  $("view").innerHTML = `<div class="title"><h2>Performance</h2><p>${esc(commit.id)} · ${esc(commit.subject || "")}</p></div>
    ${rows ? `<div class="panel"><h3>Scénarios (make bench)</h3><table class="metrics">
      <thead><tr><th>Scénario</th><th>FPS</th><th>Frames</th><th>Entités max</th><th>Balles max</th><th>Ennemis max</th></tr></thead>
      <tbody>${rows}</tbody></table></div>` : ""}
    ${sim ? `<div class="panel" style="margin-top:20px"><h3>alacod-sim (${(commit.sim || []).length} graines)</h3><table class="metrics">
      <thead><tr><th>Graine</th><th>Vague</th><th>Morts</th><th>Kills</th><th>FPS</th><th>Desync</th></tr></thead>
      <tbody>${sim}</tbody></table></div>` : ""}`;
  setHash(`${commit.id}/performance`);
}

// ---- lecteur ---------------------------------------------------------------------------
function video() { return current?.video; }
function duration() { const v = video(); return v && v.duration ? v.duration : 0; }

function bindPlayer(events, name) {
  const v = $("video");
  current = v ? { video: v, events, name } : null;
  for (const t of document.querySelectorAll("textarea[data-note]")) {
    const key = `alacod-review:${t.dataset.note}`;
    t.value = store(key);
    t.addEventListener("input", () => store(key, t.value));
  }
  if (!v) return;
  for (const chip of document.querySelectorAll(".ev[data-frame], .mark[data-frame]")) {
    chip.addEventListener("click", (e) => { e.stopPropagation(); v.pause(); seekTo(Number(chip.dataset.frame) / SIM_FPS); });
  }
  $("play").onclick = togglePlay;
  $("restart").onclick = () => seekTo(0);
  $("back").onclick = () => step(-IMAGE_STEP);
  $("fwd").onclick = () => step(IMAGE_STEP);
  $("speed").onchange = (e) => (v.playbackRate = Number(e.target.value));
  const prev = $("ev-prev"), next = $("ev-next");
  if (prev) prev.onclick = () => jumpEvent(-1);
  if (next) next.onclick = () => jumpEvent(1);
  const tl = $("timeline");
  const seekFromPointer = (e) => {
    const r = tl.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
    if (duration()) seekTo((x / r.width) * duration());
  };
  tl.addEventListener("pointerdown", (e) => { dragging = true; v.pause(); tl.setPointerCapture(e.pointerId); seekFromPointer(e); });
  tl.addEventListener("pointermove", (e) => { if (dragging) seekFromPointer(e); });
  tl.addEventListener("pointerup", (e) => { dragging = false; tl.releasePointerCapture(e.pointerId); });
  v.addEventListener("timeupdate", updatePosition);
  v.addEventListener("play", syncButton);
  v.addEventListener("pause", syncButton);
  v.addEventListener("ended", syncButton);
  v.addEventListener("loadedmetadata", () => { placeMarks(); seekTo(Math.min(INITIAL_TIME, v.duration || INITIAL_TIME)); });
  if (v.readyState >= 1) { placeMarks(); seekTo(Math.min(INITIAL_TIME, v.duration)); }
  syncButton();
}

function placeMarks() {
  const total = duration() * SIM_FPS;
  if (!total) return;
  for (const m of document.querySelectorAll(".timeline .mark")) {
    m.style.left = `${Math.min(100, (Number(m.dataset.frame) / total) * 100)}%`;
  }
}

function seekTo(t) {
  const v = video();
  if (!v) return;
  v.currentTime = Math.min(Math.max(t, 0), v.duration || t);
  updatePosition();
}

function currentFrame() { const v = video(); return v ? Math.round(v.currentTime * SIM_FPS) : 0; }

function updatePosition() {
  const v = video();
  if (!v) return;
  const frame = currentFrame();
  $("frame").textContent = `frame ${frame} · ${v.currentTime.toFixed(2)} s`;
  const ratio = v.duration ? v.currentTime / v.duration : 0;
  $("progress").style.width = `${ratio * 100}%`;
  $("playhead").style.left = `${ratio * 100}%`;
  const events = current.events || [];
  let idx = -1;
  events.forEach((e, i) => { if (e.frame <= frame) idx = i; });
  document.querySelectorAll(".ev[data-i]").forEach((chip) => {
    const i = Number(chip.dataset.i);
    chip.classList.toggle("past", i < idx);
    chip.classList.toggle("current", i === idx);
  });
  const cur = $("ev-current");
  if (cur) {
    const e = events[idx];
    cur.innerHTML = e ? `<span class="f">f${e.frame}</span>${esc(e.label)}${idx + 1 < events.length ? ` <span class="f">· suivant f${events[idx + 1].frame}</span>` : ""}`
                      : `<span class="f">avant le premier moment clé${events.length ? ` (f${events[0].frame})` : ""}</span>`;
    const chip = document.querySelector(".ev.current");
    if (chip && !dragging) scrollChipIntoList(chip);
  }
}

// Fait défiler la liste des moments clés (et elle seule : `scrollIntoView` ferait aussi
// défiler la page pendant la lecture) pour garder le moment courant visible.
function scrollChipIntoList(chip) {
  const list = chip.parentElement;
  if (!list) return;
  const top = chip.offsetTop - list.offsetTop;
  const bottom = top + chip.offsetHeight;
  if (top < list.scrollTop) list.scrollTop = top;
  else if (bottom > list.scrollTop + list.clientHeight) list.scrollTop = bottom - list.clientHeight;
}

function jumpEvent(dir) {
  const events = current?.events || [];
  if (!events.length) return;
  const frame = currentFrame();
  let target = null;
  if (dir > 0) target = events.find((e) => e.frame > frame + 1);
  else { for (const e of events) if (e.frame < frame - 1) target = e; }
  if (!target) return;
  video().pause();
  seekTo(target.frame / SIM_FPS);
}

function playing() { const v = video(); return v && !v.paused && !v.ended; }
function syncButton() { const b = $("play"); if (b) b.textContent = playing() ? "⏸ Pause" : "▶ Lecture"; }
function togglePlay() {
  const v = video();
  if (!v) return;
  if (playing()) v.pause();
  else { if (v.ended || v.currentTime >= v.duration - 0.05) v.currentTime = 0; v.play(); }
  syncButton();
}
function step(delta) { const v = video(); if (!v) return; v.pause(); seekTo(v.currentTime + delta); }
function setSpeed(value) { const s = $("speed"); if (!s) return; s.value = value; const v = video(); if (v) v.playbackRate = Number(value); }

document.addEventListener("keydown", (e) => {
  if (["TEXTAREA", "INPUT", "SELECT"].includes(e.target.tagName) || !video()) return;
  const s = $("speed");
  const speeds = [...s.options].map((o) => o.value);
  const i = speeds.indexOf(s.value);
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); step(IMAGE_STEP); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-IMAGE_STEP); }
  else if (e.key === "n" || e.key === ".") jumpEvent(1);
  else if (e.key === "p" || e.key === ",") jumpEvent(-1);
  else if (e.key === "Home") { e.preventDefault(); seekTo(0); }
  else if (e.key === "]" && i < speeds.length - 1) setSpeed(speeds[i + 1]);
  else if (e.key === "[" && i > 0) setSpeed(speeds[i - 1]);
});

// ---- navigation ------------------------------------------------------------------------
document.querySelector("aside").addEventListener("click", (e) => {
  const item = e.target.closest(".nav-item");
  if (!item) return;
  if (item.dataset.video) selectVideo(item.dataset.video);
  else if (item.dataset.compare !== undefined) selectCompare(Number(item.dataset.compare));
  else if (item.dataset.perf) selectPerf();
});
$("commit").onchange = (e) => { commit = DATA.commits[Number(e.target.value)]; renderSidebar(); openFirst(); };
$("filter").oninput = () => { renderScenarioList(); if (current) markActive(`video:${current.name}`); };

function openFirst() {
  if (commit && commit.videos.length) selectVideo(commit.videos[0].name);
  else $("view").innerHTML = `<div class="empty">Aucune vidéo pour cette révision : <code>make videos</code></div>`;
}

function openFromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("compare/")) { const i = Number(h.slice(8)); if (DATA.compares[i]) { selectCompare(i); return true; } }
  const [cid, name] = h.split("/");
  const c = DATA.commits.find((x) => x.id === cid);
  if (!c) return false;
  commit = c; renderSidebar();
  if (name === "performance") selectPerf();
  else if (name && (name === "montage" || c.videos.some((v) => v.name === name))) selectVideo(name);
  else openFirst();
  return true;
}

commit = DATA.commits[0] || null;
renderSidebar();
if (!openFromHash()) {
  if (commit) openFirst();
  else if (DATA.compares.length) selectCompare(0);
  else $("view").innerHTML = `<div class="empty">Aucun rendu : <code>make videos</code></div>`;
}
window.addEventListener("hashchange", () => { if (decodeURIComponent(location.hash.slice(1)) !== lastHash) openFromHash(); });
</script>
</body>
