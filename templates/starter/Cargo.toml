[package]
name = "{{name}}"
version = "0.0.1"
edition = "2021"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
  "bevy_sprite", "bevy_render", "bevy_core_pipeline", "webgl2", "png", "multi_threaded"
]}
bevy_ecs_tilemap = { version = "0.19.0", default-features = false }
bevy_ecs_ldtk = { version = "0.15", default-features = false, features = ["derive", "internal_levels"] }
bevy_ggrs = "0.22.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"

utils = { {{engine:utils}} }
content = { {{engine:content}} }
map = { {{engine:map}} }
game = { {{engine:game}} }
entry = { {{engine:entry}} }
map_ldtk = { {{engine:map_ldtk}} }
bevy_fixed = { {{engine:bevy_fixed}} }
animation = { {{engine:animation}} }
sim_core = { {{engine:sim_core}} }
effects = { {{engine:effects}} }

[features]
default = ["lighting", "render"]
render = ["map_ldtk/render", "bevy_ecs_ldtk/render"]
lighting = ["game/lighting"]
native = ["bevy/file_watcher", "game/debug_ui"]

# Le jeu est son propre workspace : le `[patch]` de l'engine ne s'applique qu'à sa racine.
[workspace]

[patch.crates-io]
bevy_ecs_ldtk = { git = "https://github.com/estran-studio/bevy_ecs_ldtk", branch = "transform_ldtk_project" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
