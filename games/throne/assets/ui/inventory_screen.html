<!-- Inventaire gungeon (M2-T18, docs/conventions.md §56), rendu bevy_hui.
     Les conteneurs `id` portent les noms des listes ; chaque jauge nommée fournit
     les propriétés {nom_label} et {nom_width}. -->
<template>
    <property name="title">Inventaire</property>
    <property name="hint"></property>
    <property name="charge_label"></property>
    <property name="charge_width">0%</property>
    <node width="100%" height="100%" align_items="center" justify_content="center" background="#05060ab8" global_zindex="20">
        <node width="520px" flex_direction="column" row_gap="6px" padding="24px" background="#141414f2" border="2px" border_color="#ffffff55">
            <text font="fonts/FiraMono-Medium.ttf" font_size="30" font_color="#f1c40f">{title}</text>
            <text font="fonts/FiraMono-Medium.ttf" font_size="16" font_color="#ffffff88">Armes</text>
            <node id="weapons" flex_direction="column"></node>
            <text font="fonts/FiraMono-Medium.ttf" font_size="16" font_color="#ffffff88">Objet actif</text>
            <node id="active" flex_direction="column"></node>
            <node width="240px" height="10px" background="#00000066"><node width="{charge_width}" height="100%" background="#f1c40f"></node></node>
            <text font="fonts/FiraMono-Medium.ttf" font_size="14" font_color="#ffffff">{charge_label}</text>
            <text font="fonts/FiraMono-Medium.ttf" font_size="16" font_color="#ffffff88">Passifs</text>
            <node id="passives" flex_direction="column"></node>
            <text font="fonts/FiraMono-Medium.ttf" font_size="16" font_color="#ffffff88">Consommables</text>
            <node id="consumables" flex_direction="column"></node>
            <text font="fonts/FiraMono-Medium.ttf" font_size="14" font_color="#ffffff88">{hint}</text>
        </node>
    </node>
</template>
