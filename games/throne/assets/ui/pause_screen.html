<!-- Menu de pause (M2-T18, docs/conventions.md §56), rendu bevy_hui.
     Les textes viennent des sections ; id="entries" reçoit la liste et son focus. « detail » porte
     l'écran des touches (S1-1, docs/conventions.md §93) : large, police à chasse fixe, colonnes alignées. -->
<template>
    <property name="title">Pause</property>
    <property name="detail"></property>
    <property name="hint"></property>
    <node width="100%" height="100%" align_items="center" justify_content="center" background="#05060ab8" global_zindex="20">
        <node width="640px" flex_direction="column" row_gap="10px" padding="24px" background="#141414f2" border="2px" border_color="#ffffff55">
            <text font="fonts/FiraMono-Medium.ttf" font_size="30" font_color="#f1c40f">{title}</text>
            <node id="entries" flex_direction="column" row_gap="6px"></node>
            <text font="fonts/FiraMono-Medium.ttf" font_size="15" font_color="#ffffffcc">{detail}</text>
            <text font="fonts/FiraMono-Medium.ttf" font_size="14" font_color="#ffffff88">{hint}</text>
        </node>
    </node>
</template>
