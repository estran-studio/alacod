# Registre des licences des assets binaires de games/throne/assets/ (voie V6, même règles que
# games/zombies/assets/assets.yaml). Créé par m1-v2-contenu-throne (T1.0c + T1.11) : `throne`
# n'a encore **aucun asset propre** ; tous les fichiers ci-dessous sont des **placeholders**
# copiés du testbed (eux-mêmes identiques à ceux de zombies), entrées reprises de
# games/zombies/assets/assets.yaml (chemins `exemples/atlas/` devenus `atlas/`). Les ennemis
# de throne utilisent désormais les sprites zombie provisoires pour la revue M1 ;
# les personnages de laboratoire conservent leurs skins sans sprite.
# Exception : les sons (tir et rechargement du lot A, événements du lot B de
# docs/plan-assets.md, 2026-10-14) ne sont pas des placeholders ; mêmes fichiers dans les jeux.

