- id: sound-shots-michel-baradari
  fichiers:
    - sounds/shot_pistol.ogg
    - sounds/shot_shotgun.ogg
    - sounds/shot_smg.ogg
  source: https://opengameart.org/content/chaingun-pistol-rifle-shotgun-shots (archive
    https://opengameart.org/sites/default/files/shots.7z, fichiers pistol.wav, shotgun.wav,
    cg1.wav ; page lue le 2026-10-14, lot A de docs/plan-assets.md)
  auteur: Michel Baradari (apollo-music.de, aujourd'hui ultimate-sounds.de), publié sur
    OpenGameArt par qubodup
  licence: CC BY 3.0 (https://creativecommons.org/licenses/by/3.0/) — affichée sur la page
    (« License(s) CC-BY 3.0 ») et dans le info.txt de l'archive (« Sounds (c) by Michel
    Baradari apollo-music.de / Licensed under CC BY 3.0 »)
  attribution: "Sounds (c) by Michel Baradari apollo-music.de, CC BY 3.0"
  modifications: rogné (pistol.wav → shot_pistol 0,45 s ; shotgun.wav → shot_shotgun 0,50 s,
    avant le bruit de pompe ; cg1.wav → shot_smg 0,30 s), fondu de sortie (0,15 / 0,15 /
    0,12 s), stéréo mixée en mono, 44,1 kHz, normalisé à -3 dBFS crête, ré-encodé en ogg
    vorbis (oggenc -q 5)
  statut: lot A (D32), mêmes fichiers dans les quatre jeux ; pas un placeholder

