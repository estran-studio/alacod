- id: cartes-ldtk-interne
  fichiers:
    - exemples/test_map.ldtk
    - exemples/test_map_shop.ldtk
    - maps/avant_poste.ldtk
    - maps/le_relais_prototype.ldtk
    - maps/le_relais_modules.ldtk
  source: contenu du projet — avant_poste.ldtk a été générée par la voie V6
    (tâche m0-v8-carte-zombies, script gen_map.py hors dépôt) à partir de la
    structure de exemples/test_map.ldtk (couches Walls/LevelConnection/Entities,
    mêmes defs d'entités)
  auteur: "équipe alacod (avant_poste : William Quintal + agent V6)"
  licence: interne au projet (pas de contenu tiers ; les tilesets référencés
    — SunnyLand et Dungeon_asset — sont enregistrés ci-dessus)
  modifications: avant_poste respecte les conventions de test_map.ldtk ; relPath
    des tilesets préfixés de ../exemples/ (les cartes vivent dans maps/).
    le_relais_prototype reprend les définitions d’avant_poste avec quatre
    orientations d’un bâtiment de cinq pièces, spawners extérieurs, placements
    et cache de tuiles SunnyLand provisoire (scripts/construire-le-relais.py).

    le_relais_modules contient quatorze salles assemblées par la graine avant la
    simulation (scripts/construire-modules-le-relais.py).
