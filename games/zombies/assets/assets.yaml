# Registre des licences des assets binaires de games/zombies/assets/.
# Voie V6 (docs/taches.md §11) : tout asset a une licence enregistrée avant
# d'entrer dans le dépôt ; chaque fichier binaire du dossier a une entrée
# (id, fichiers, source réellement consultée, auteur, licence, modifications).
# Règles : CC0 d'abord ; CC-BY accepté avec le crédit ici ; rien d'ambigu.
# Créé par la tâche m0-v8-carte-zombies : enregistre les packs déjà présents
# puis les nouveaux fichiers de la carte.

