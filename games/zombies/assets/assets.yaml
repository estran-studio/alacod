    # l'archive du pack, dans des chemins gitignorés (sprites/postapo/, sprites/sprites.local.ron,
    # ui/hud.local.ron).
    - sprites/postapo/player.png
    - sprites/postapo/zombie_small.png
    - sprites/postapo/zombie_axe.png
    - sprites/postapo/zombie_big.png
    - sprites/postapo/weapon_pistol.png
    - sprites/postapo/weapon_machine_gun.png
    - sprites/postapo/weapon_shotgun.png
    - "sprites/postapo/*.png"  # S1-8 : portes, fenêtres, icônes d'armes et de power-ups, projectiles, atlas de murs et de sol
    - "sprites/postapo/hud/*.png"  # icônes du HUD
  source: https://thelazystone.itch.io/post-apocalyptic-pixel-art-asset-pack
    (PostApocalypse_AssetPack_v1.1.2.zip ; LICENSE.txt de l'archive lu le 2026-10-28)
  auteur: TheLazyStone
  licence: licence propre de l'auteur (LICENSE.txt de l'archive) — gratuit pour usage non
    commercial ; usage commercial contre paiement (2 $ ou plus), **licence commerciale achetée par William
    Quintal le 2026-10-28 (2 $)** ; **redistribution interdite**, sous
    forme originale ou modifiée ; crédit facultatif (lien de la page ou « TheLazyStone »). Fichiers NON
    commités (dépôt public), surcharge locale de sprites/sprites.ron et de ui/hud.ron, sprites publics
    ailleurs (docs/conventions.md §2). Un build web public qui embarquerait ces images attend la
    confirmation écrite de l'auteur (plan-polissage § 0.3, décision 1).
  modifications: feuilles de profil (side) redécoupées et réalignées en cellules uniformes
    (Idle|Run|Dying_1|Attack, pieds centrés) ; images assemblées par recadrage, collage, miroir et mise
    à l'échelle entière de tuiles et de sprites du pack (portes, fenêtres, atlas de murs et de sol,
    icônes) par scripts/repack-postapocalypse.py ; aucun pixel dessiné.
  statut: overlay privé (zombies + throne), pas un placeholder

