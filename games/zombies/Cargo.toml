[package]
name = "zombies"
version = "0.0.1"
edition = "2021"
build = "../../scripts/embed-game-content.rs"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
  "bevy_sprite", "bevy_render", "bevy_core_pipeline", "webgl2", "png", "multi_threaded"
]}
bevy_ecs_tilemap = { version = "0.19.0", default-features = false }
bevy_ecs_ldtk = { version = "0.15", default-features = false, features = ["derive", "internal_levels"] }
bevy_ggrs = "0.22.0"

serde_json = "1.0"

utils = { path = "../../crates/utils" }
content = { path = "../../crates/content" }
map = { path = "../../crates/map" }
game = { path = "../../crates/game" }
map_ldtk = { path = "../../crates/map_ldtk" }
bevy_fixed = { path = "../../crates/bevy_fixed" }
animation = { path = "../../crates/animation" }

[features]
default = ["lighting", "render"]

# Rendu des tilemaps. Les builds headless (tests, replays) compilent sans.
render = ["map_ldtk/render", "bevy_ecs_ldtk/render"]

lighting = ["game/lighting"]

native = [
  "bevy/file_watcher",
  "game/debug_ui"
]
