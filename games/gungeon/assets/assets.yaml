# Registre des licences des assets binaires de games/gungeon/assets/ (voie V6, mêmes règles que
# games/zombies/assets/assets.yaml). Créé par m2-t0d-squelette-gungeon : `gungeon` n'a encore
# **aucun asset propre** ; tous les fichiers ci-dessous sont des **placeholders** copiés de
# `games/throne` (eux-mêmes du testbed et de zombies). Aucun asset nouveau. Lot C (2026-10-15) :
# les ennemis, le boss, le héros, les objets du monde et les projectiles ont leurs sprites
# (Tiny Dungeon et Particle Pack de Kenney, CC0 ; entrées en fin de fichier).
# Exception : les sons (tir et rechargement du lot A, événements du lot B de
# docs/plan-assets.md, 2026-10-14) ne sont pas des placeholders ; mêmes fichiers dans les jeux.

