# Registre des licences des assets binaires de games/gungeon/assets/ (voie V6, mêmes règles que
# games/zombies/assets/assets.yaml). Créé par m2-t0d-squelette-gungeon : `gungeon` n'a encore
# **aucun asset propre** ; tous les fichiers ci-dessous sont des **placeholders** copiés de
# `games/throne` (eux-mêmes du testbed et de zombies). Aucun asset nouveau. Les ennemis et le boss
# n'ont aucun sprite (comme les personnages de laboratoire du testbed).
# Exception : les sons de tir et de rechargement (lot A de docs/plan-assets.md, 2026-10-14) ne
# sont pas des placeholders ; mêmes fichiers dans les quatre jeux.

