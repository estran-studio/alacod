<!-- Menu de pause (M2-T18, docs/conventions.md §56) : option B du test comparatif d'UI, bevy_hui.
     Les {propriétés} sont posées par game::ui::screens::hui depuis la vue commune. -->
<template>
    <property name="title">Pause</property>
    <property name="e0"></property>
    <property name="e1"></property>
    <property name="e2"></property>
    <property name="e3"></property>
    <property name="c0">#ffffff</property>
    <property name="c1">#ffffff</property>
    <property name="c2">#ffffff</property>
    <property name="c3">#ffffff</property>
    <property name="b0">#00000000</property>
    <property name="b1">#00000000</property>
    <property name="b2">#00000000</property>
    <property name="b3">#00000000</property>
    <property name="detail"></property>
    <property name="hint"></property>
    <node width="100%" height="100%" align_items="center" justify_content="center" background="#05060ab8" global_zindex="20">
        <node width="380px" flex_direction="column" row_gap="10px" padding="24px" background="#141414f2" border="2px" border_color="#ffffff55">
            <text font="fonts/FiraMono-Medium.ttf" font_size="30" font_color="#f1c40f">{title}</text>
            <node padding="2px 8px 2px 8px" background="{b0}"><text font="fonts/FiraMono-Medium.ttf" font_size="22" font_color="{c0}">{e0}</text></node>
            <node padding="2px 8px 2px 8px" background="{b1}"><text font="fonts/FiraMono-Medium.ttf" font_size="22" font_color="{c1}">{e1}</text></node>
            <node padding="2px 8px 2px 8px" background="{b2}"><text font="fonts/FiraMono-Medium.ttf" font_size="22" font_color="{c2}">{e2}</text></node>
            <node padding="2px 8px 2px 8px" background="{b3}"><text font="fonts/FiraMono-Medium.ttf" font_size="22" font_color="{c3}">{e3}</text></node>
            <text font="fonts/FiraMono-Medium.ttf" font_size="16" font_color="#ffffffaa">{detail}</text>
            <text font="fonts/FiraMono-Medium.ttf" font_size="14" font_color="#ffffff88">{hint}</text>
        </node>
    </node>
</template>
