name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  check:
    name: Tests & Format
    # La poussée des notes de revue du nightly (actor `alacod-nightly`) ne
    # doit pas re-déclencher tests + déploiement : boucle infinie sinon.
    if: false # Temporaire: réactiver après validation du pipeline de publication.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache cargo registry and git
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-all-crates: true

      - name: Format check
        run: make format

      - name: Run tests
        run: cargo test

      - name: Run scenario tests
        run: make test_scenarios

      - name: Check forbidden patterns
        run: ./scripts/check-forbidden.sh
        continue-on-error: true

      - name: Check rollback registration
        run: ./scripts/check-rollback-registration.sh

  build:
    name: Build WASM & Deploy
    runs-on: [self-hosted, alacod-builder]
    needs: check
    if: always() && github.actor != 'alacod-nightly'
    environment: production
    steps:
      - name: Clean workspace with sudo
        run: |
          if [ -d "${{ github.workspace }}" ]; then
            sudo chown -R $USER:$USER ${{ github.workspace }}
          fi
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Build local builder image
        run: docker build --platform linux/amd64 -f Dockerfile.builder -t alacod-builder:ci .
      - name: Fix host cache permissions
        run: |
          # Use a root container to chown the host's cache directories back to the current user
          docker run --rm \
            -v "$HOME/.cargo:/cargo_cache" \
            -v "$HOME/.cache/sccache:/sccache_cache" \
            alacod-builder:ci \
            bash -c "chown -R $(id -u):$(id -g) /cargo_cache /sccache_cache"
      - name: Build WASM in container
        run: |
          # 1. Get the Group ID (GID) of the docker socket
          DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)

          docker run --rm \
            -u "$(id -u):$(id -g)" \
            --group-add "$DOCKER_GID" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e HOME=/tmp \
            alacod-builder:ci \
            docker version

          docker run --rm \
            -u "$(id -u):$(id -g)" \
            --group-add "$DOCKER_GID" \
            -v "${{ github.workspace }}:/workspace" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e HOME=/tmp \
            -e CARGO_HOME=/cargo \
            -v "$HOME/.cargo/registry:/cargo/registry" \
            -v "$HOME/.cargo/git:/cargo/git" \
            -e SCCACHE_DIR=/sccache \
            -v "$HOME/.cache/sccache:/sccache" \
            -w /workspace \
            -e RUSTC_WRAPPER=sccache \
            -e CARGO_INCREMENTAL=0 \
            alacod-builder:ci \
            bash -c "cargo vendor && WEB_ENABLE_SOLO=1 WEB_ENABLE_ONLINE=1 make build_docker_website TARGET=web PROFILE=prod"

      - name: Push docker website
        if: false # Le site est publié par Pages; aucun push d’image n’est requis.
        run: |
          # 1. Calculer le GID du socket Docker (comme à l'étape précédente)
          DOCKER_GID=$(stat -c '%g' /var/run/docker.sock 2>/dev/null || \
                       python3 -c "import os; print(os.stat('/var/run/docker.sock').st_gid)" 2>/dev/null || \
                       echo "0")

          docker run --rm \
            -u "$(id -u):$(id -g)" \
            --group-add "$DOCKER_GID" \
            -v "${{ github.workspace }}:/workspace" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /workspace \
            -e HOME=/tmp \
            -e GITHUB_ACCESS_TOKEN=${{ secrets.ACCESS_TOKEN }} \
            ghcr.io/bascanada/alacod-builder:1.0.0 \
            bash -c "docker login https://ghcr.io -u wquintal -p \$GITHUB_ACCESS_TOKEN && make push_docker_website"
      
      - name: Export build files
        run: |
          VERSION=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')-$(git rev-parse --short HEAD)")
          docker create --name $VERSION ghcr.io/bascanada/alacod:latest
          docker cp $VERSION:/usr/share/nginx/html ./build
          docker rm $VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Cloudflare Pages and R2 release
        run: |
          rm -rf website/build
          cp -a build website/build
          npm ci --prefix website
          node scripts/prepare-cloudflare.mjs

      - name: Upload immutable WASM to R2
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e 'for (const u of require("./.cloudflare-upload.json").uploads) console.log(`${u.key}\t${u.file}`)' |
          while IFS=$'\t' read -r key file; do
            npx --yes wrangler@4.149.0 r2 object put "alacod-game-builds/$key" --remote --file "$file" --content-type application/wasm --cache-control 'public, max-age=31536000, immutable'
          done

      - name: Publish to Cloudflare Pages
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 pages deploy .cloudflare-dist --project-name alacod --branch main

      - name: Cleanup build artifacts
        if: always()
        run: |
          # Clean up target directories after build
          chmod -R u+w "${{ github.workspace }}/target_wasm_prod" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/target_wasm_prod" || true
          rm -rf "${{ github.workspace }}/build" || true
        continue-on-error: true
