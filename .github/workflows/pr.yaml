name: PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  check:
    name: Tests & Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache cargo registry and git
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-all-crates: true

      - name: Format check
        run: make format

      - name: Test validation tools
        run: make test_tools

      - name: Check deterministic patterns and rollback registration
        run: make check_forbidden check_rollback_registration

      - name: Run workspace tests (headless, including P2P regression tests)
        run: make test_crates

      - name: Run scenario tests
        run: make test_scenarios

      - name: Lint game content
        run: make lint
