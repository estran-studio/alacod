name: PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# Un nouveau push sur la même PR annule la vérification en cours.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yaml
