name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release
    runs-on: [self-hosted, alacod-builder]
    environment: production
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # S-0b (docs/conventions.md § 99) : surcharge privée (images payantes, extraits Sonniss) depuis le dépôt privé
      # estran-studio/alacod-assets, AVANT le build. Sans le secret (fork, pull request) l'étape saute et le repli public
      # se construit ; avec le secret, elle pose ALACOD_WEB_PRIVATE_ASSETS=1 (D161 : sans cette variable, aucun build web
      # n'embarque la surcharge, même présente sur le disque).
      - name: Assets privés (alacod-assets)
        env:
          ALACOD_ASSETS_DEPLOY_KEY: ${{ secrets.ALACOD_ASSETS_DEPLOY_KEY }}
        run: scripts/assets-prives.sh --ci

      - name: Login docker
        run: docker login https://ghcr.io -u wquintal -p $GITHUB_ACCESS_TOKEN
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Build WASM in container
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workspace" \
            -e CARGO_HOME=/cargo \
            -v "$HOME/.cargo/registry:/cargo/registry" \
            -v "$HOME/.cargo/git:/cargo/git" \
            -e SCCACHE_DIR=/sccache \
            -v "$HOME/.cache/sccache:/sccache" \
            -w /workspace \
            -e RUSTC_WRAPPER=sccache \
            -e CARGO_INCREMENTAL=0 \
            -e ALACOD_WEB_PRIVATE_ASSETS \
            ghcr.io/bascanada/alacod-builder:1.0.0 \
            bash -c "cargo vendor && make build_docker_website TARGET=web PROFILE=prod"

      - name: Push docker website
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /workspace \
            -e GITHUB_ACCESS_TOKEN=${{ secrets.ACCESS_TOKEN }} \
            ghcr.io/bascanada/alacod-builder:1.0.0 \
            bash -c "docker login https://ghcr.io -u wquintal -p \$GITHUB_ACCESS_TOKEN && make push_docker_website"

      - name: Export build files
        run: |
          VERSION=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')-$(git rev-parse --short HEAD)")
          docker create --name $VERSION ghcr.io/bascanada/alacod:latest
          docker cp $VERSION:/usr/share/nginx/html ./build
          docker rm $VERSION

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./build --project-name=alacod

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        with:
          generate_release_notes: true

      - name: Retirer les assets privés du workspace
        if: always()
        run: git clean -ffdX -- games || true
